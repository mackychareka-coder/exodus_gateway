<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Staff Attendance Terminal</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4" data-page-roles="GATE_OPERATOR SECURITY_GUARD">
  <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 max-w-md w-full space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <h2 class="text-lg font-bold uppercase text-amber-600 tracking-wide">Staff Directory Gate</h2><a href="/scanner" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl font-bold">← Back Menu</a>
    </div>
    <div class="space-y-4">
      <div><label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Search by Employee ID or Name</label>
        <input type="text" id="emp-search" placeholder="e.g. EXODUS-12 or Jane" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 bg-gray-50/50"></div>
      <div><label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Select Profile</label>
        <select id="emp-select" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm text-gray-900 bg-white h-14 focus:outline-none focus:border-amber-500"></select></div>
      <div>
        <label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Arrived By (for Check In)</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 p-3 border-2 border-gray-200 rounded-xl text-sm"><input type="radio" name="arrival" value="walk_in" checked> On foot</label>
          <label class="flex items-center gap-2 p-3 border-2 border-gray-200 rounded-xl text-sm"><input type="radio" name="arrival" value="vehicle"> By vehicle</label>
        </div>
        <p id="vehicle-hint" class="text-[11px] text-gray-500 mt-1"></p>
        <div id="vehicle-panel" class="hidden mt-3 space-y-2 bg-amber-50/60 p-3 rounded-xl border border-amber-200">
          <select id="veh-select" class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm bg-white"></select>
          <p id="veh-none" class="hidden text-xs text-amber-700 font-bold">No vehicle on file for this employee. Enter the details below; they will be saved to the employee's profile.</p>
          <div id="veh-new" class="hidden space-y-2">
            <input id="veh-plate" maxlength="16" placeholder="Number plate (required)" class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm bg-white focus:outline-none">
            <input id="veh-model" maxlength="50" placeholder="Car model (optional)" class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm bg-white focus:outline-none">
            <input id="veh-color" maxlength="30" placeholder="Car colour (optional)" class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm bg-white focus:outline-none">
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button id="btn-in" class="h-14 bg-green-600 text-white font-bold text-sm rounded-xl shadow-lg">Check In</button>
        <button id="btn-out" class="h-14 bg-amber-600 text-white font-bold text-sm rounded-xl shadow-lg">Check Out</button>
      </div>
      <p class="text-[11px] text-gray-400 text-center">Entries made here are recorded as MANUAL and tied to your login.</p>
      <div id="response-box" class="hidden"></div>
    </div>
  </div>
  <script src="/static/js/api.js" defer></script><script src="/static/js/staff.js" defer></script>
</body></html>
