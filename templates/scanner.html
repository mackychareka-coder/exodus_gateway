<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>EXODUS & CO | Kiosk Terminal</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 md:p-8 select-none justify-center" data-page-roles="GATE_OPERATOR SECURITY_GUARD">
  <div class="w-full max-w-4xl text-center space-y-8">
    <div class="flex flex-col items-center gap-3">
      <img src="/static/logo.png" alt="EXODUS & CO Logo" class="h-24 w-auto rounded-xl shadow border border-gray-200">
      <h1 class="text-3xl font-serif tracking-wider font-bold text-gray-950">EXODUS & CO</h1>
      <p class="text-sm uppercase tracking-widest text-amber-600 font-bold">Welcome to Reception Services</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <a href="/scanner/staff-checkin" class="bg-white p-8 rounded-2xl shadow-md border-2 border-transparent hover:border-amber-500 flex flex-col items-center justify-center gap-2 h-44">
        <span class="text-3xl">🪪</span><span class="font-bold text-lg text-gray-900">Staff Check-In / Out</span><span class="text-xs text-gray-400">Record attendance events</span></a>
      <a href="/scanner/visitor-register" class="bg-white p-8 rounded-2xl shadow-md border-2 border-transparent hover:border-cyan-500 flex flex-col items-center justify-center gap-2 h-44">
        <span class="text-3xl">📝</span><span class="font-bold text-lg text-gray-900">Visitor Registration</span><span class="text-xs text-gray-400">Check-in new site arrivals</span></a>
      <a href="/scanner/visitor-checkout" class="bg-white p-8 rounded-2xl shadow-md border-2 border-transparent hover:border-red-500 flex flex-col items-center justify-center gap-2 h-44">
        <span class="text-3xl">🚪</span><span class="font-bold text-lg text-gray-900">Visitor Check-Out</span><span class="text-xs text-gray-400">Log a departure</span></a>
      <a data-roles="SECURITY_GUARD" href="/scanner/add-employee" class="bg-white p-8 rounded-2xl shadow-md border-2 border-transparent hover:border-slate-700 flex flex-col items-center justify-center gap-2 h-44">
        <span class="text-3xl">👤</span><span class="font-bold text-lg text-gray-900">Add New Employee</span><span class="text-xs text-gray-400">Register workforce credentials</span></a>
    </div>
    <div class="flex gap-4 justify-center pt-4">
      <a data-roles="SECURITY_GUARD" href="/dashboard" class="bg-gray-900 text-white font-bold text-sm px-6 py-3 rounded-xl shadow">View Dashboard</a>
      <button data-logout class="bg-white border text-gray-700 font-bold text-sm px-6 py-3 rounded-xl shadow">Logout System</button>
    </div>
  </div>
  <script src="/static/js/api.js" defer></script>
</body></html>
