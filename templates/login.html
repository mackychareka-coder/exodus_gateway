<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>EXODUS & CO | System Authentication</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 text-center space-y-6">
    <div class="flex flex-col items-center gap-2">
      <img src="/static/logo.png" alt="EXODUS & CO Logo" class="h-20 w-auto rounded-xl shadow border border-amber-500/20">
      <h1 class="text-xl font-serif tracking-wider font-bold text-amber-500 mt-2">EXODUS & CO</h1>
      <p class="text-xs uppercase tracking-widest text-gray-400">Security Gateway Terminal</p>
    </div>
    <hr class="border-gray-700/60">
    <form id="login-form" class="space-y-4 text-left" autocomplete="off">
      <div>
        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Username</label>
        <input id="username" name="username" type="text" required maxlength="64" autocomplete="username" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Password</label>
        <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white font-mono text-sm focus:outline-none focus:border-amber-500">
      </div>
      <div id="login-error" role="alert" class="hidden p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl font-medium text-center"></div>
      <button id="login-btn" type="submit" class="w-full bg-amber-600 hover:bg-amber-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl shadow-lg text-sm tracking-wide">Authenticate Session</button>
    </form>
    <p class="text-[10px] text-gray-500 font-mono">Protected Terminal Infrastructure</p>
  </div>
  <script src="/static/js/api.js" defer></script><script src="/static/js/login.js" defer></script>
</body></html>
