<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Employee Registration</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4" data-page-roles="SECURITY_GUARD">
  <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 max-w-md w-full space-y-4">
    <div class="flex justify-between items-center border-b pb-4 mb-2">
      <h2 class="text-lg font-bold uppercase text-slate-700 tracking-wide">Register Employee</h2><a href="/scanner" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl font-bold">← Back Menu</a>
    </div>
    <input type="text" id="new-emp-id" maxlength="32" placeholder="Employee ID (e.g., EXODUS-99)" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm bg-gray-50/50 focus:outline-none focus:border-slate-500">
    <input type="text" id="new-emp-name" maxlength="100" placeholder="Full Name" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm bg-gray-50/50 focus:outline-none focus:border-slate-500">
    <input type="text" id="new-emp-contact" maxlength="24" placeholder="Mobile (optional)" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm bg-gray-50/50 focus:outline-none focus:border-slate-500">
    <input type="text" id="new-emp-email" maxlength="254" placeholder="Email for visitor alerts (optional)" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm bg-gray-50/50 focus:outline-none focus:border-slate-500">
    <div><label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Parking Pass Profile</label>
      <select id="new-emp-has-vehicle" class="w-full p-4 border-2 border-gray-200 rounded-xl text-sm text-gray-900 bg-white h-14 focus:outline-none"><option value="no">No Vehicle Tracking</option><option value="yes">Register Car Parking Profile</option></select></div>
    <div id="vehicle-section" class="hidden bg-amber-50/50 p-4 rounded-xl border border-amber-200 space-y-3 border-l-4 border-l-amber-500">
      <input type="text" id="veh-reg" maxlength="16" placeholder="Plate Registration Code" class="w-full p-3 border-2 border-gray-200 rounded-lg text-sm focus:outline-none">
      <input type="text" id="veh-model" maxlength="50" placeholder="Car Model" class="w-full p-3 border-2 border-gray-200 rounded-lg text-sm focus:outline-none">
      <input type="text" id="veh-color" maxlength="30" placeholder="Car Color" class="w-full p-3 border-2 border-gray-200 rounded-lg text-sm focus:outline-none">
    </div>
    <button id="reg-submit" class="w-full h-14 bg-slate-800 text-white font-bold text-sm rounded-xl shadow-lg">Commit Record Entry</button>
    <div id="reg-response-box" class="hidden"></div>
  </div>
  <script src="/static/js/api.js" defer></script><script src="/static/js/add_employee.js" defer></script>
</body></html>
