<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EXODUS & CO | Manage Users</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="bg-gray-900 text-slate-100 font-sans min-h-screen p-4 md:p-6 space-y-6" data-page-roles="SUPER_ADMIN">
  <div class="max-w-6xl mx-auto flex items-center justify-between border-b border-amber-600/30 pb-4">
    <div><h1 class="text-2xl font-serif text-amber-500 font-bold">Manage Users</h1><p class="text-xs uppercase tracking-widest text-gray-400">Create accounts and assign roles</p></div>
    <div class="flex gap-3 text-sm">
      <a href="/dashboard" class="bg-gray-800 border border-gray-700 px-5 py-3 rounded-xl font-bold">Dashboard</a>
      <button data-logout class="bg-gray-800 border border-gray-700 px-5 py-3 rounded-xl font-bold">Secure Logout</button>
    </div>
  </div>

  <div class="max-w-6xl mx-auto bg-gray-800 p-5 rounded-xl border border-gray-700/60 space-y-3">
    <h2 class="font-bold text-cyan-400">Create account</h2>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <input id="nu-username" maxlength="64" placeholder="Username" autocomplete="off" class="p-3 bg-gray-900 border border-gray-700 rounded-xl text-sm">
      <input id="nu-password" type="password" maxlength="128" placeholder="Password (12+ characters)" autocomplete="new-password" class="p-3 bg-gray-900 border border-gray-700 rounded-xl text-sm">
      <select id="nu-role" class="p-3 bg-gray-900 border border-gray-700 rounded-xl text-sm">
        <option value="GATE_OPERATOR">GATE_OPERATOR (kiosk)</option>
        <option value="SECURITY_GUARD">SECURITY_GUARD (reception)</option>
        <option value="EMPLOYEE">EMPLOYEE (host)</option>
        <option value="SUPER_ADMIN">SUPER_ADMIN</option>
      </select>
      <select id="nu-employee" class="hidden p-3 bg-gray-900 border border-gray-700 rounded-xl text-sm"><option value="">Link to employee…</option></select>
    </div>
    <button id="nu-submit" class="bg-amber-600 text-white font-bold text-sm px-6 py-3 rounded-xl">Create account</button>
    <div id="nu-msg" class="hidden"></div>
  </div>

  <div class="max-w-6xl mx-auto bg-gray-800 p-5 rounded-xl border border-gray-700/60">
    <h2 class="font-bold text-slate-200 border-b border-gray-700 pb-2 mb-3">Accounts</h2>
    <div class="overflow-x-auto"><table class="w-full text-left text-sm">
      <thead><tr class="text-gray-400 uppercase text-[10px]"><th class="py-2">Username</th><th>Role</th><th>Employee</th><th>Status</th><th>Last login</th><th class="text-right">Actions</th></tr></thead>
      <tbody id="user-rows" class="divide-y divide-gray-700/40"></tbody></table></div>
    <div id="list-msg" class="hidden"></div>
  </div>
  <script src="/static/js/api.js" defer></script><script src="/static/js/admin_users.js" defer></script>
</body></html>
